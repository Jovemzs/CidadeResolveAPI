# Blueprint do Render: serviço web (Docker) + PostgreSQL, ambos no plano gratuito.
databases:
  - name: cidaderesolve-db
    plan: free
    databaseName: cidaderesolve
    user: cidaderesolve
    postgresMajorVersion: "16"

services:
  - type: web
    name: cidaderesolve-api
    runtime: docker
    plan: free
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cidaderesolve-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRA_MINUTOS
        value: "60"
      - key: UPLOAD_DIR
        value: uploads
      - key: GESTOR_EMAIL
        sync: false
      - key: GESTOR_SENHA
        sync: false
